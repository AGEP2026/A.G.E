    <section class="agregar-cliente">
        <form>
    
            <label for="nombre">Nombre cliente:</label>
            <input type="text" id="nombre" required>
    
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required>
    
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required>
    
    
            <label for="ubi">Ubicacion:</label>
            <input type="text" id="ubi">
    
            <label for="fecharegistro">Fecha de Registro:</label>
            <input type="date" id="fecharegistro">
    
            <textarea name="Descripcion" id="Descripcion-cliente" placeholder="Agregar descripcion"></textarea>
    
    
            
            <input type="button" value="Eliminar" id="eliminarclientebtn">
    
        </form>
        <img src="image/sinfoto.jpg" alt="Agregar imagen cliente" id="imagen-AniadirCliente" >
