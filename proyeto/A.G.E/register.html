<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <link rel="icon" href="./image/Logo A.G.E.png">
</head>
<body>
    <div class="contenedor-principal2">   
        <div class="login">
            <form id="register-form" action="dashboard.html" method="get">
            <h1>Registrarse</h1>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="username" placeholder="Nombre" required>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" name="password" placeholder="Contraseña" required>
            <label for="confirm_pass">Repetir Contraseña:</label>
            <input type="password" id="confirm_pass" name="confirm_password" placeholder="Repetir Contraseña" required>
            <label for="login">¿Ya tienes una cuenta?</label>
            <a href="login.html" class="inicioreg">Inicia sesión</a>
            <button type="submit" class="botonlog">Registrarse</button>
            </form>
            <a href="login.html" class="inicioreg">Regresar</a>
        </div>
            <div class="seccion-negra2">
    </div>
</body>
</html>
