<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Cuenta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <link rel="icon" href="./image/Logo A.G.E.png">
</head>
<body>
<div class="contenedor-principal2">
    <div class="login">
        <form id="recovery-form" action="login.html" method="get">
        <h1>Recuperar Cuenta</h1>
        <p>Ingresa tu usuario o correo electrónico asociado a tu cuenta. Te enviaremos un código de verificación a tu correo electrónico.</p>

        <label for="email">Usuario o Correo electrónico:</label>
        <input type="text" id="email" name="email" required>
        <button type="button" id="send-code" class="botonlog">Enviar código</button>
        <p id="recovery-status" hidden></p>

        <div id="code-step" hidden>
            <label for="codigo">Ingresa el código:</label>
            <input type="text" id="codigo" name="codigo" required>
            <p class="resend">No recibiste el código? <a href="#" id="resend-code" class="inicioreg">Solicitar nuevamente</a></p>
            <button type="submit" class="botonlog">Recuperar Cuenta</button>
        </div>
        </form>

        <a href="login.html" class="inicioreg">Regresar</a>
    </div>
    <div class="seccion-negra2">
</div>
</body>
</html>
