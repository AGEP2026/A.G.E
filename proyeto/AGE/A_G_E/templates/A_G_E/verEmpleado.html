<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Empleado</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'script.js' %}" defer></script>
    <link rel="icon" href="{% static 'image/Logo A.G.E.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body data-registro-tipo="empleado" data-lista-url="{% url 'empleados' %}">
<div class="contenedor">
    <h1 class="tit">Empleados</h1>
    <button id="toggleBtn" onfocus="abri()" onblur="abri()">
        <i class="fa-solid fa-bars menuoculto" style="background: transparent;"></i>
    </button>
    <aside id="navlateral" class="navlateral">
        <div class="nav">
            <nav>
                <ul>
                    <img src="{% static 'image/logo_fondo_negro.png' %}" alt="Logo de la empresa" class="logonav" width="100">
                    <li><a href="{% url 'dashboard' %}"><i class="fa-solid fa-house" id="dashb"></i>Dashboard</a></li>
                    <li><a href="{% url 'configuracion' %}"><i class="fa-solid fa-gear"></i>Configuración</a></li>
                    <li><a href="{% url 'clientes' %}"><i class="fa-solid fa-people-group"></i>Clientes</a></li>
                    <li><a href="{% url 'facturacion' %}"><i class="fa-solid fa-file-invoice"></i>Facturación</a></li>
                    <li class="seleccionadoNav"><a href="{% url 'empleados' %}"><i class="fa-solid fa-user-group"></i>Empleados</a></li>
                    <li><a href="{% url 'inventario' %}"><i class="fa-solid fa-boxes-stacked"></i>Inventario</a></li>
                    <li><a href="{% url 'produccion' %}"><i class="fa-solid fa-gears"></i>Producción</a></li>
                    <li><a href="{% url 'estadisticas' %}"><i class="fa-solid fa-chart-line"></i>Estadísticas</a></li>
                    <li><a href="{% url 'notificaciones' %}"><i class="fa-solid fa-bell"></i>Notificaciones</a></li>
                </ul>
                <p class="footerNav" style="color: #fff;">2026 A.G.E. Todos los derechos reservados.&#174;</p>
            </nav>
        </div>
    </aside>
    <section class="agregar-cliente">
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required>

            <label for="Identificacion">Identificacion:</label>
            <input type="number" id="Identificacion">

            <label for="area">Area:</label>
            <select name="" id="area">
                <option value="">Produccion</option>
                <option value="">Ventas</option>
                <option value="">Compras</option>
                <option value="">Otra</option>
            </select>
            

            <label for="Horario">Horario:</label>
            <input type="time" id="Horario">

            <textarea name="Descripcion" id="Descripcion-cliente" placeholder="Agregar descripcion"></textarea>

            <input type="reset" value="Eliminar" id="eliminarclientebtn">
        </form>
        

        <img src="{% static 'image/sinfoto.jpg' %}" alt="Agregar imagen cliente" id="imagen-AniadirCliente">

        <a href="{% url 'empleados' %}" id="regresar-clientes"><</a>
    </section>
</div>
</body>

</html>
