<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Cuenta</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'script.js' %}" defer></script>
    <link rel="icon" href="{% static 'image/Logo_A.G.E.png' %}">
</head>

<body>
    <div class="contenedor-principal2">
        <div class="login">
            <form id="recovery-form" action="{% url 'recuperar_cuenta' %}" method="POST">

                {% csrf_token %}
                <h1>Recuperar Cuenta</h1>
                <p>Ingresa tu usuario o correo electrónico asociado a tu cuenta. Te enviaremos un código de verificación
                    a tu correo electrónico.</p>

                <label for="email">Usuario o Correo electrónico:</label>
                <input type="text" id="email" name="email" required>
                <button type="submit" id="send-code" class="botonlog">Enviar código</button>
                <p id="recovery-status" hidden></p>
            </form>

            <a href="{% url 'login' %}" class="inicioreg">Regresar</a>
        </div>
        <div class="seccion-negra2">
        </div>
</body>

</html>
